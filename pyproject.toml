[project]
name = "autonomous-code-workspace"
version = "0.1.0"
description = "Autonomous Code & Analysis Workspace powered by LangGraph, Gemini 2.5, and Docker Sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.0",
    "google-genai>=0.1.1",
    "docker>=7.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

